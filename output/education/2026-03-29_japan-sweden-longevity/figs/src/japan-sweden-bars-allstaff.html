<!DOCTYPE html>
<html lang="ja">
<head>

  <title>日本とスウェーデンの女性の75歳からの余命（棒グラフ）</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FBF6EA;
      --color-ink: #0F2238;
      --color-muted: #4A5568;

      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>日本とスウェーデンの女性の75歳からの余命（棒グラフ）</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="japan-sweden-bars-allstaff-title japan-sweden-bars-allstaff-desc">

        <desc id="japan-sweden-bars-allstaff-desc">75歳からの女性の余命を、健康に暮らせる年数と介護を受けている期間に分けた積み上げ棒。日本の女性は介護を受けている期間が長い。</desc>
        <defs>

        <line x1="530" y1="90" x2="530" y2="314" stroke="#B5CEE0" stroke-width="1.5"/>

        <line x1="730" y1="90" x2="730" y2="314" stroke="#B5CEE0" stroke-width="1.5"/>

        <line x1="930" y1="90" x2="930" y2="314" stroke="#B5CEE0" stroke-width="1.5"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="930" y="350" font-size="22" font-weight="500" fill="#4A5568" text-anchor="middle">15</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="974" y="350" font-size="22" font-weight="500" fill="#4A5568" text-anchor="start">年</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="310" y="156.8" font-size="30" font-weight="600" fill="#0F2238" text-anchor="end">日本女性</text>
        <rect x="330" y="104" width="416" height="84" rx="0" fill="#B5CEE0"/>

        <rect x="956" y="124.92" width="129.6" height="40.8" rx="0" fill="#FBF6EA"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="964" y="158.24" font-size="34" font-weight="600" fill="#0F2238" text-anchor="start">15.5年</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="310" y="268.8" font-size="30" font-weight="600" fill="#0F2238" text-anchor="end">スウェーデン女性</text>
        <rect x="330" y="216" width="396" height="84" rx="0" fill="#B5CEE0"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="528" y="268.08" font-size="28" font-weight="600" fill="#0F2238" text-anchor="middle">9.9年</text>
        <rect x="726" y="216" width="152" height="84" rx="0" fill="#1B6FA6"/>

        <rect x="884" y="236.92" width="129.6" height="40.8" rx="0" fill="#FBF6EA"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="892" y="270.24" font-size="34" font-weight="600" fill="#0F2238" text-anchor="start">13.7年</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="388" font-size="26" font-weight="600" fill="#1B6FA6" text-anchor="start">日本の介護を受けている高齢者は、スウェーデンより長く生きている</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="422" font-size="24" font-weight="500" fill="#0F2238" text-anchor="start">これが日本の長寿の大きな理由かもしれません</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="454" font-size="22" font-weight="500" fill="#4A5568" text-anchor="start">棒の右端は75歳からの余命（合計）</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="484" font-size="22" font-weight="500" fill="#4A5568" text-anchor="start">出典: Murata S, Modig K, et al. BMC Medicine 2026;24:160</text>
