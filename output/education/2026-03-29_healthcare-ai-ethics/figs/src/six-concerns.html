<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6つの倫理的懸念カテゴリ</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FFFFFF;
      --color-ink: #030712;
      --color-muted: #4A5568;
      --color-accent: #1E5BE6;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>6つの倫理的懸念カテゴリ</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="six-concerns-title six-concerns-desc">
        <title id="six-concerns-title">6つの倫理的懸念カテゴリ</title>
        <desc id="six-concerns-desc">2019年から2025年の243件をスクリーニングして22件の実証研究を選び、そこから透明性と信頼、バイアスと公正性、プライバシー、説明責任、倫理と道徳、規制と法律の6カテゴリを抽出した流れと、各カテゴリの核心的な問いを示した図。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5568"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1E5BE6"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
                <path d="M180,200 V256" fill="none" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
        <path d="M320,327 H360" fill="none" stroke="#1E5BE6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
                <rect x="40" y="60" width="280" height="140" rx="6" fill="#F5F8FC" stroke="#C7D2E3" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="180" y="128" font-size="60" font-weight="600" fill="#030712" text-anchor="middle">243件</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="180" y="164" font-size="24" font-weight="500" fill="#1F2937" text-anchor="middle">2019–2025年を</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="180" y="190" font-size="24" font-weight="500" fill="#1F2937" text-anchor="middle">スクリーニング</text>
        <rect x="40" y="262" width="280" height="130" rx="6" fill="#EEF3FD" stroke="#1E5BE6" stroke-width="2.5"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="180" y="330" font-size="60" font-weight="600" fill="#1E5BE6" text-anchor="middle">22件</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="180" y="372" font-size="24" font-weight="500" fill="#1F2937" text-anchor="middle">実証研究を選定</text>
        <rect x="368" y="40" width="712" height="424" rx="6" fill="#F5F8FC" stroke="#C7D2E3" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="392" y="78" font-size="30" font-weight="600" fill="#030712" text-anchor="start">6カテゴリ</text>
        <rect x="384" y="92" width="332" height="114" rx="6" fill="#FFFFFF" stroke="#030712" stroke-width="2"/>
        <circle cx="414" cy="124" r="17" fill="#1E5BE6"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="414" y="131" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="442" y="134" font-size="30" font-weight="600" fill="#030712" text-anchor="start">透明性と信頼</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="400" y="168" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">AIの判断過程を</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="400" y="195" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">理解できるか？</text>
        <rect x="732" y="92" width="332" height="114" rx="6" fill="#FFFFFF" stroke="#030712" stroke-width="2"/>
        <circle cx="762" cy="124" r="17" fill="#1E5BE6"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="762" y="131" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="790" y="134" font-size="30" font-weight="600" fill="#030712" text-anchor="start">バイアスと公正性</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="748" y="168" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">全ての患者集団に</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="748" y="195" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">公平に機能するか？</text>
        <rect x="384" y="214" width="332" height="114" rx="6" fill="#FFFFFF" stroke="#030712" stroke-width="2"/>
        <circle cx="414" cy="246" r="17" fill="#1E5BE6"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="414" y="253" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="442" y="256" font-size="30" font-weight="600" fill="#030712" text-anchor="start">プライバシー</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="400" y="290" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">患者データは</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="400" y="317" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">適切に保護されるか？</text>
        <rect x="732" y="214" width="332" height="114" rx="6" fill="#FFFFFF" stroke="#030712" stroke-width="2"/>
        <circle cx="762" cy="246" r="17" fill="#1E5BE6"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="762" y="253" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="790" y="256" font-size="30" font-weight="600" fill="#030712" text-anchor="start">説明責任</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="748" y="290" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">AIのエラーの</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="748" y="317" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">責任は誰が負うか？</text>
        <rect x="384" y="336" width="332" height="114" rx="6" fill="#FFFFFF" stroke="#030712" stroke-width="2"/>
        <circle cx="414" cy="368" r="17" fill="#1E5BE6"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="414" y="375" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="442" y="378" font-size="30" font-weight="600" fill="#030712" text-anchor="start">倫理と道徳</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="400" y="412" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">自律的AI判断は</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="400" y="439" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">道徳的に許容されるか？</text>
        <rect x="732" y="336" width="332" height="114" rx="6" fill="#FFFFFF" stroke="#030712" stroke-width="2"/>
        <circle cx="762" cy="368" r="17" fill="#1E5BE6"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="762" y="375" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">6</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="790" y="378" font-size="30" font-weight="600" fill="#030712" text-anchor="start">規制と法律</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="748" y="412" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">既存の法制度は</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="748" y="439" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">AIに対応できているか？</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="498" font-size="22" font-weight="500" fill="#69737F" text-anchor="start">出典: Wubineh et al., BMC Medical Ethics 2026</text>
      </svg>
    </div>
  </div>
</body>
</html>
