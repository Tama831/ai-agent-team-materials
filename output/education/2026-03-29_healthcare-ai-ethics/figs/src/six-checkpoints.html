<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6つのチェックポイント</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FFFFFF;
      --color-ink: #030712;
      --color-muted: #4A5568;
      --color-accent: #1E5BE6;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>6つのチェックポイント</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="six-checkpoints-title six-checkpoints-desc">
        <title id="six-checkpoints-title">6つのチェックポイント</title>
        <desc id="six-checkpoints-desc">世界の研究22件から、透明性と信頼、偏りと公平性、プライバシー、責任の所在、道徳的な問題、法律とルールの6つのチェックポイントが見えてきたことと、それぞれの問いを示した図。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5568"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1E5BE6"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
                <path d="M320,225 H360" fill="none" stroke="#1E5BE6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
                <rect x="40" y="150" width="280" height="150" rx="6" fill="#EEF3FD" stroke="#1E5BE6" stroke-width="2.5"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="180" y="222" font-size="60" font-weight="600" fill="#1E5BE6" text-anchor="middle">22件</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="180" y="258" font-size="24" font-weight="500" fill="#1F2937" text-anchor="middle">世界の研究</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="180" y="284" font-size="24" font-weight="500" fill="#1F2937" text-anchor="middle">（実証研究）</text>
        <rect x="368" y="40" width="712" height="424" rx="6" fill="#F5F8FC" stroke="#C7D2E3" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="392" y="78" font-size="30" font-weight="600" fill="#030712" text-anchor="start">6つのチェックポイント</text>
        <rect x="384" y="92" width="332" height="114" rx="6" fill="#FFFFFF" stroke="#030712" stroke-width="2"/>
        <circle cx="414" cy="124" r="17" fill="#1E5BE6"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="414" y="131" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="442" y="134" font-size="30" font-weight="600" fill="#030712" text-anchor="start">透明性と信頼</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="400" y="168" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">AIがなぜそう判断したか、</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="400" y="195" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">分かるか？</text>
        <rect x="732" y="92" width="332" height="114" rx="6" fill="#FFFFFF" stroke="#030712" stroke-width="2"/>
        <circle cx="762" cy="124" r="17" fill="#1E5BE6"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="762" y="131" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="790" y="134" font-size="30" font-weight="600" fill="#030712" text-anchor="start">偏りと公平性</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="748" y="168" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">全ての患者さんに</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="748" y="195" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">同じように正確か？</text>
        <rect x="384" y="214" width="332" height="114" rx="6" fill="#FFFFFF" stroke="#030712" stroke-width="2"/>
        <circle cx="414" cy="246" r="17" fill="#1E5BE6"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="414" y="253" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="442" y="256" font-size="30" font-weight="600" fill="#030712" text-anchor="start">プライバシー</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="400" y="290" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">患者さんのデータは</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="400" y="317" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">守られているか？</text>
        <rect x="732" y="214" width="332" height="114" rx="6" fill="#FFFFFF" stroke="#030712" stroke-width="2"/>
        <circle cx="762" cy="246" r="17" fill="#1E5BE6"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="762" y="253" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="790" y="256" font-size="30" font-weight="600" fill="#030712" text-anchor="start">責任の所在</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="748" y="290" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">間違いがあったら</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="748" y="317" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">誰が責任を取るか？</text>
        <rect x="384" y="336" width="332" height="114" rx="6" fill="#FFFFFF" stroke="#030712" stroke-width="2"/>
        <circle cx="414" cy="368" r="17" fill="#1E5BE6"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="414" y="375" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="442" y="378" font-size="30" font-weight="600" fill="#030712" text-anchor="start">道徳的な問題</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="400" y="412" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">AIに任せていいことの</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="400" y="439" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">線引きは？</text>
        <rect x="732" y="336" width="332" height="114" rx="6" fill="#FFFFFF" stroke="#030712" stroke-width="2"/>
        <circle cx="762" cy="368" r="17" fill="#1E5BE6"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="762" y="375" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">6</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="790" y="378" font-size="30" font-weight="600" fill="#030712" text-anchor="start">法律とルール</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="748" y="412" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">法整備は</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="748" y="439" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">追いついているか？</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="498" font-size="22" font-weight="500" fill="#69737F" text-anchor="start">出典: Wubineh et al., BMC Medical Ethics 2026（システマティックレビュー）</text>
      </svg>
    </div>
  </div>
</body>
</html>
