<svg width="1200" height="660" viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect x="0" y="0" width="1200" height="660" fill="#FBF7EF"/>
  <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#2E2E2E">「継続性がある」を3つに分解する（Haggerty 2003）</text>

  <!-- Box 1: Relational -->
  <rect x="55" y="120" width="320" height="210" rx="12" fill="#DCEFEA" stroke="#2E8E80" stroke-width="3"/>
  <text x="215" y="168" text-anchor="middle" font-size="23" font-weight="bold" fill="#0D4A40">関係継続性</text>
  <text x="215" y="194" text-anchor="middle" font-size="15" fill="#1F6B5F">Relational</text>
  <text x="215" y="240" text-anchor="middle" font-size="17" fill="#2E332C">特定の医師/チームとの</text>
  <text x="215" y="264" text-anchor="middle" font-size="17" fill="#2E332C">長期的な関係</text>
  <rect x="140" y="285" width="150" height="30" rx="15" fill="#2E8E80"/>
  <text x="215" y="306" text-anchor="middle" font-size="15" fill="#FFFFFF">人に依存</text>

  <!-- Box 2: Management -->
  <rect x="440" y="120" width="320" height="210" rx="12" fill="#FBEBD4" stroke="#C07E16" stroke-width="3"/>
  <text x="600" y="168" text-anchor="middle" font-size="23" font-weight="bold" fill="#7A4E0B">調整継続性</text>
  <text x="600" y="194" text-anchor="middle" font-size="15" fill="#8A5A0C">Management</text>
  <text x="600" y="240" text-anchor="middle" font-size="17" fill="#2E332C">複数の医師・場・時間を</text>
  <text x="600" y="264" text-anchor="middle" font-size="17" fill="#2E332C">またぐ治療の調整</text>
  <rect x="510" y="285" width="180" height="30" rx="15" fill="#C07E16"/>
  <text x="600" y="306" text-anchor="middle" font-size="15" fill="#FFFFFF">誰かが繋ぐ</text>

  <!-- Box 3: Informational -->
  <rect x="825" y="120" width="320" height="210" rx="12" fill="#DCE7DF" stroke="#5E7E68" stroke-width="3"/>
  <text x="985" y="168" text-anchor="middle" font-size="23" font-weight="bold" fill="#2E4636">情報継続性</text>
  <text x="985" y="194" text-anchor="middle" font-size="15" fill="#4C5A52">Informational</text>
  <text x="985" y="240" text-anchor="middle" font-size="17" fill="#2E332C">記録で引き継ぐ</text>
  <text x="985" y="264" text-anchor="middle" font-size="17" fill="#2E332C">（誰がかかっても伝わる）</text>
  <rect x="880" y="285" width="210" height="30" rx="15" fill="#3D4A3E"/>
  <text x="985" y="306" text-anchor="middle" font-size="15" fill="#FFFFFF">仕組みでスケール ◎</text>

  <!-- arrows -->
  <path d="M 378 225 L 437 225" stroke="#8A8F85" stroke-width="4" marker-end="url(#ar)"/>
  <path d="M 763 225 L 822 225" stroke="#8A8F85" stroke-width="4" marker-end="url(#ar)"/>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8A8F85"/></marker></defs>

  <!-- callout band -->
  <rect x="55" y="375" width="1090" height="78" rx="12" fill="#3D4A3E"/>
  <text x="600" y="412" text-anchor="middle" font-size="20" font-weight="bold" fill="#FBF7EF">「あの先生」が無理でも、情報継続性は記録・連携で代替できる</text>
  <text x="600" y="440" text-anchor="middle" font-size="17" fill="#C9D2C5">＝ 医師が入れ替わりやすい過疎地ほど価値が高い</text>

  <!-- person→system axis -->
  <path d="M 215 500 L 985 500" stroke="#B4B2A9" stroke-width="3" marker-end="url(#ar2)"/>
  <defs><marker id="ar2" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B4B2A9"/></marker></defs>
  <text x="215" y="535" text-anchor="middle" font-size="16" fill="#8A8F85">人に依存（スケールしにくい）</text>
  <text x="985" y="535" text-anchor="middle" font-size="16" fill="#5E7E68">仕組みで代替（スケールする）</text>
  <line x1="50" y1="610" x2="1150" y2="610" stroke="#E4DFD3" stroke-width="1.5"/>
  <text x="50" y="638" font-size="14" fill="#9A978D">概念図：Haggerty の継続性枠組み（Howells A, et al. BMC Primary Care 2025, PMID 40604407 経由）に基づき作成。論文の転載図ではない。</text>
</svg>
