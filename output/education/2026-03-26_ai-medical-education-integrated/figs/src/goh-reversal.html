<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診断推論スコアの逆転</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FFFFFF;
      --color-ink: #030712;
      --color-muted: #4A5568;
      --color-accent: #1E5BE6;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>診断推論スコアの逆転</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="goh-reversal-title goh-reversal-desc">
        <title id="goh-reversal-title">診断推論スコアの逆転</title>
        <desc id="goh-reversal-desc">診断推論スコアは、GPT-4単独が約90%、医師とGPT-4の併用が76%（中央値）、医師単独が74%で、併用と医師単独の差は有意でなかったことを横棒で示した図。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5568"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1E5BE6"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
                <path d="M400,46 V358" fill="none" stroke="#C7D2E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="90" font-size="32" font-weight="600" fill="#030712" text-anchor="start">GPT-4 単独</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="126" font-size="24" font-weight="500" fill="#69737F" text-anchor="start">医師単独より16ポイント高い</text>
        <rect x="400" y="58" width="396.00000000000006" height="68" rx="4" fill="#1E5BE6"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="816.0" y="118" font-size="72" font-weight="600" fill="#1E5BE6" text-anchor="start">約90%</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="202" font-size="32" font-weight="600" fill="#030712" text-anchor="start">医師 + GPT-4</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="238" font-size="24" font-weight="500" fill="#69737F" text-anchor="start">（中央値）</text>
        <rect x="400" y="170" width="334.40000000000003" height="68" rx="4" fill="#AEBBD0"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="754.4000000000001" y="230" font-size="72" font-weight="600" fill="#030712" text-anchor="start">76%</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="314" font-size="32" font-weight="600" fill="#030712" text-anchor="start">医師 単独</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="350" font-size="24" font-weight="500" fill="#69737F" text-anchor="start">（従来の資料のみ）</text>
        <rect x="400" y="282" width="325.6" height="68" rx="4" fill="#AEBBD0"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="745.6" y="342" font-size="72" font-weight="600" fill="#030712" text-anchor="start">74%</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="410" font-size="28" font-weight="600" fill="#1E5BE6" text-anchor="start">医師 + GPT-4 と 医師単独の差は有意でなかった（p = 0.60）</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="450" font-size="24" font-weight="500" fill="#1F2937" text-anchor="start">症例は6つの模擬症例で、実臨床とは異なる</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="494" font-size="22" font-weight="500" fill="#69737F" text-anchor="start">出典: Goh et al., JAMA Netw Open 2024（ランダム化比較試験、医師50名、6症例）</text>
      </svg>
    </div>
  </div>
</body>
</html>
