<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文脈設計の3要素</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FBF6EA;
      --color-ink: #0F2238;
      --color-muted: #4A5568;
      --color-accent: #1B6FA6;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>文脈設計の3要素</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sdhctx-title sdhctx-desc">
        <title id="sdhctx-title">文脈設計の3要素</title>
        <desc id="sdhctx-desc">誰が聞くか、どの状況で聞くか、聞いた後に何ができるかの3要素を順に並べ、ツール選択より文脈設計が先決であることを示す図。</desc>
        <defs>
          <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5568"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#FBF6EA"/>
        <rect x="40" y="40" width="304" height="282" rx="6" fill="#DCEBF5" stroke="#A9C6DB" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="192" y="86" font-size="30" font-weight="600" fill="#4A5568" text-anchor="middle">①</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="192" y="128" font-size="30" font-weight="600" fill="#0F2238" text-anchor="middle">誰が</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="192" y="166" font-size="30" font-weight="600" fill="#0F2238" text-anchor="middle">聞くか</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="192" y="224" font-size="24" font-weight="500" fill="#4A5568" text-anchor="middle">担い手の選択</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="192" y="262" font-size="26" font-weight="500" fill="#0F2238" text-anchor="middle">医師 / 看護師</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="192" y="300" font-size="26" font-weight="500" fill="#0F2238" text-anchor="middle">MSW / CHW</text>
        <line x1="352" y1="181" x2="400" y2="181" stroke="#4A5568" stroke-width="3" marker-end="url(#ah)"/>
        <rect x="408" y="40" width="304" height="282" rx="6" fill="#DCEBF5" stroke="#A9C6DB" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="86" font-size="30" font-weight="600" fill="#4A5568" text-anchor="middle">②</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="128" font-size="30" font-weight="600" fill="#0F2238" text-anchor="middle">どの状況で</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="166" font-size="30" font-weight="600" fill="#0F2238" text-anchor="middle">聞くか</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="224" font-size="26" font-weight="500" fill="#0F2238" text-anchor="middle">待合</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="262" font-size="26" font-weight="500" fill="#0F2238" text-anchor="middle">診察室</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="300" font-size="26" font-weight="500" fill="#0F2238" text-anchor="middle">電話フォロー</text>
        <line x1="720" y1="181" x2="768" y2="181" stroke="#4A5568" stroke-width="3" marker-end="url(#ah)"/>
        <rect x="776" y="40" width="304" height="282" rx="6" fill="#FBF6EA" stroke="#1B6FA6" stroke-width="3"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="928" y="86" font-size="30" font-weight="600" fill="#4A5568" text-anchor="middle">③</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="928" y="128" font-size="30" font-weight="600" fill="#0F2238" text-anchor="middle">聞いた後に</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="928" y="166" font-size="30" font-weight="600" fill="#0F2238" text-anchor="middle">何ができるか</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="928" y="224" font-size="26" font-weight="500" fill="#0F2238" text-anchor="middle">紹介先・介入</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="928" y="262" font-size="26" font-weight="500" fill="#0F2238" text-anchor="middle">オプションの準備</text>
        <rect x="40" y="356" width="1040" height="120" rx="6" fill="#FBF6EA" stroke="#A9C6DB" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="406" font-size="34" font-weight="600" fill="#1B6FA6" text-anchor="middle">ツール選択より文脈設計が先決</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="452" font-size="26" font-weight="500" fill="#0F2238" text-anchor="middle">スクリーニングはactionability（行動可能性）があって初めて意味を持つ</text>
      </svg>
    </div>
  </div>
</body>
</html>
