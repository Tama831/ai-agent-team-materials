<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDH要素を含む診療報酬プログラム</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FBF6EA;
      --color-ink: #0F2238;
      --color-muted: #4A5568;
      --color-accent: #1B6FA6;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>SDH要素を含む診療報酬プログラム</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sdh-eight-title sdh-eight-desc">
        <title id="sdh-eight-title">SDH要素を含む診療報酬プログラム</title>
        <desc id="sdh-eight-desc">診療報酬8プログラムのうち、SDH要素を明確に含むのは入退院支援加算とこころの連携指導料の2つで、残り6つは明確なSDH要素を含まないことを示す図。</desc>
        <rect width="100%" height="100%" fill="#FBF6EA"/>
        <rect x="40" y="40" width="60" height="60" rx="6" fill="#1B6FA6"/>
        <rect x="112" y="40" width="60" height="60" rx="6" fill="#1B6FA6"/>
        <rect x="184" y="40" width="60" height="60" rx="6" fill="#FBF6EA" stroke="#91959C" stroke-width="2"/>
        <rect x="256" y="40" width="60" height="60" rx="6" fill="#FBF6EA" stroke="#91959C" stroke-width="2"/>
        <rect x="40" y="112" width="60" height="60" rx="6" fill="#FBF6EA" stroke="#91959C" stroke-width="2"/>
        <rect x="112" y="112" width="60" height="60" rx="6" fill="#FBF6EA" stroke="#91959C" stroke-width="2"/>
        <rect x="184" y="112" width="60" height="60" rx="6" fill="#FBF6EA" stroke="#91959C" stroke-width="2"/>
        <rect x="256" y="112" width="60" height="60" rx="6" fill="#FBF6EA" stroke="#91959C" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="262" font-size="96" font-weight="600" fill="#1B6FA6" text-anchor="start">2</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="112" y="262" font-size="56" font-weight="600" fill="#4A5568" text-anchor="start">/ 8</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="316" font-size="26" font-weight="500" fill="#0F2238" text-anchor="start">SDH要素を明確に</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="350" font-size="26" font-weight="500" fill="#0F2238" text-anchor="start">含むプログラム</text>
        <rect x="332" y="40" width="364" height="252" rx="6" fill="#FFFFFF" stroke="#1B6FA6" stroke-width="3"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="356" y="108" font-size="34" font-weight="600" fill="#0F2238" text-anchor="start">入退院支援加算</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="356" y="170" font-size="28" font-weight="500" fill="#0F2238" text-anchor="start">入院・2008年導入</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="356" y="210" font-size="28" font-weight="500" fill="#0F2238" text-anchor="start">最新改定は2022年</text>
        <rect x="716" y="40" width="364" height="252" rx="6" fill="#FFFFFF" stroke="#1B6FA6" stroke-width="3"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="740" y="108" font-size="34" font-weight="600" fill="#0F2238" text-anchor="start">こころの連携指導料</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="740" y="170" font-size="28" font-weight="500" fill="#0F2238" text-anchor="start">外来・2022年新設</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="332" y="358" font-size="28" font-weight="500" fill="#0F2238" text-anchor="start">残り6プログラムは、SDH要素を明確には含まない</text>
        <line x1="40" y1="384" x2="1080" y2="384" stroke="#B7C7D3" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="418" font-size="24" font-weight="500" fill="#4A5568" text-anchor="start">いずれも論文の評価時点（2022年改定）の要件</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="450" font-size="24" font-weight="500" fill="#4A5568" text-anchor="start">2026年6月施行の改定で入退院支援加算は見直されており、論文には反映されていない</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="484" font-size="22" font-weight="500" fill="#4A5568" text-anchor="start">出典: Sakurai H ほか, JMA Journal 2026;9(1)</text>
      </svg>
    </div>
  </div>
</body>
</html>
