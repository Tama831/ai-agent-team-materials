<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eラーニングのテスト正答率</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FBF6EA;
      --color-ink: #0F2238;
      --color-muted: #4A5568;
      --color-accent: #1B6FA6;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>eラーニングのテスト正答率</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="psych4189-title psych4189-desc">
        <title id="psych4189-title">eラーニングのテスト正答率</title>
        <desc id="psych4189-desc">eラーニングの事前テストの正答率41%が事後に89%へ上がり、48ポイント増えたことを横棒で示す図。測ったのは知識である。</desc>
        <defs>
          <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5568"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#FBF6EA"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="250" y="58" font-size="26" font-weight="500" fill="#4A5568" text-anchor="start">eラーニングのテスト正答率</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="134" font-size="30" font-weight="600" fill="#0F2238" text-anchor="start">事前テスト</text>
        <rect x="250" y="80" width="800" height="80" rx="4" fill="#DCEBF5"/>
        <rect x="250" y="80" width="328.0" height="80" rx="4" fill="#A9C6DB"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="558.0" y="138" font-size="64" font-weight="600" fill="#0F2238" text-anchor="end">41%</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="238" font-size="30" font-weight="600" fill="#0F2238" text-anchor="start">事後</text>
        <rect x="250" y="184" width="800" height="80" rx="4" fill="#DCEBF5"/>
        <rect x="250" y="184" width="712.0" height="80" rx="4" fill="#1B6FA6"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="942.0" y="242" font-size="64" font-weight="600" fill="#FBF6EA" text-anchor="end">89%</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="250" y="332" font-size="44" font-weight="600" fill="#1B6FA6" text-anchor="start">+48ポイント（p&lt;0.001）</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="382" font-size="26" font-weight="500" fill="#0F2238" text-anchor="start">参加者の93%以上が「変化は持続可能」と回答（主観評価）</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="420" font-size="26" font-weight="600" fill="#0F2238" text-anchor="start">測ったのは知識であり、心理的安全性そのものではない</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="468" font-size="22" font-weight="500" fill="#4A5568" text-anchor="start">出典: Vu V, et al. BMJ Open Quality 2025;14(2):e003186（質改善報告・対照群なし）</text>
      </svg>
    </div>
  </div>
</body>
</html>
