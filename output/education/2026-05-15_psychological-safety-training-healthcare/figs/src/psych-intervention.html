<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理的安全性トレーニングの介入設計</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FBF6EA;
      --color-ink: #0F2238;
      --color-muted: #4A5568;
      --color-accent: #1B6FA6;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>心理的安全性トレーニングの介入設計</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="psychstages-title psychstages-desc">
        <title id="psychstages-title">心理的安全性トレーニングの介入設計</title>
        <desc id="psychstages-desc">eラーニング、2日間のシミュレーション、18ヶ月の追跡の3段階で、コミュニケーションを技術として教える介入設計を示す図。</desc>
        <defs>
          <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5568"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#FBF6EA"/>
        <rect x="40" y="50" width="304" height="290" rx="6" fill="#DCEBF5" stroke="#A9C6DB" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="192" y="106" font-size="30" font-weight="600" fill="#0F2238" text-anchor="middle">① eラーニング</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="192" y="160" font-size="24" font-weight="500" fill="#0F2238" text-anchor="middle">自己学習モジュール4本</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="192" y="196" font-size="24" font-weight="500" fill="#0F2238" text-anchor="middle">自分のペースで</text>
        <rect x="64" y="272" width="256" height="1.5" rx="0" fill="#A9C6DB"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="192" y="318" font-size="24" font-weight="600" fill="#4A5568" text-anchor="middle">知識を個人化</text>
        <line x1="352" y1="195" x2="400" y2="195" stroke="#4A5568" stroke-width="3" marker-end="url(#ah)"/>
        <rect x="408" y="50" width="304" height="290" rx="6" fill="#DCEBF5" stroke="#A9C6DB" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="106" font-size="30" font-weight="600" fill="#0F2238" text-anchor="middle">② シミュレーション</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="160" font-size="24" font-weight="500" fill="#0F2238" text-anchor="middle">2日間・対面4回</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="196" font-size="24" font-weight="500" fill="#0F2238" text-anchor="middle">危機対応・発言などの</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="232" font-size="24" font-weight="500" fill="#0F2238" text-anchor="middle">シナリオ訓練</text>
        <rect x="432" y="272" width="256" height="1.5" rx="0" fill="#A9C6DB"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="318" font-size="24" font-weight="600" fill="#4A5568" text-anchor="middle">行動を練習</text>
        <line x1="720" y1="195" x2="768" y2="195" stroke="#4A5568" stroke-width="3" marker-end="url(#ah)"/>
        <rect x="776" y="50" width="304" height="290" rx="6" fill="#DCEBF5" stroke="#A9C6DB" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="928" y="106" font-size="30" font-weight="600" fill="#0F2238" text-anchor="middle">③ 18ヶ月の追跡</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="928" y="160" font-size="24" font-weight="500" fill="#0F2238" text-anchor="middle">自己報告・観察・</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="928" y="196" font-size="24" font-weight="500" fill="#0F2238" text-anchor="middle">安全監査で</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="928" y="232" font-size="24" font-weight="500" fill="#0F2238" text-anchor="middle">変化を確認</text>
        <rect x="800" y="272" width="256" height="1.5" rx="0" fill="#A9C6DB"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="928" y="318" font-size="24" font-weight="600" fill="#4A5568" text-anchor="middle">変化が続くかを確認</text>
        <rect x="40" y="380" width="1040" height="84" rx="6" fill="#FBF6EA" stroke="#1B6FA6" stroke-width="3"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="436" font-size="32" font-weight="600" fill="#1B6FA6" text-anchor="middle">設計原則: コミュニケーションを技術として教える</text>
      </svg>
    </div>
  </div>
</body>
</html>
