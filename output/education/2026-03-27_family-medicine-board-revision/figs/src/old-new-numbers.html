<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポートフォリオの旧と新</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FBF7EF;
      --color-ink: #030712;
      --color-muted: #4A5568;
      --color-accent: #1E5BE6;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>ポートフォリオの旧と新</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="old-new-numbers-title old-new-numbers-desc">
        <title id="old-new-numbers-title">ポートフォリオの旧と新</title>
        <desc id="old-new-numbers-desc">ポートフォリオ領域数が20から16へ、学会発表が3件以上から2件以上へ。期間は3年で変わらないことを、旧と新の二つの面の大きな数字で示す図。</desc>
        <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#9A5F4C"/></marker></defs>
        <rect width="100%" height="100%" fill="#FBF7EF"/>
        <rect x="40" y="36" width="480" height="340" rx="6" fill="#FBF7EF" stroke="#EFD0C1" stroke-width="1.5"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="64" y="82" font-size="36" font-weight="600" fill="#696E67" text-anchor="start">旧</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="64" y="132" font-size="24" font-weight="500" fill="#696E67" text-anchor="start">ポートフォリオ領域数</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="64" y="222" font-size="96" font-weight="600" fill="#2E2E2E" text-anchor="start">20</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="64" y="266" font-size="24" font-weight="500" fill="#696E67" text-anchor="start">学会発表</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="64" y="352" font-size="96" font-weight="600" fill="#2E2E2E" text-anchor="start">3</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="130" y="352" font-size="36" font-weight="600" fill="#2E2E2E" text-anchor="start"> 件以上</text>
        <rect x="600" y="36" width="480" height="340" rx="6" fill="#FBF7EF" stroke="#D9876C" stroke-width="3"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="624" y="82" font-size="36" font-weight="600" fill="#9A5F4C" text-anchor="start">新</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="624" y="132" font-size="24" font-weight="500" fill="#696E67" text-anchor="start">ポートフォリオ領域数</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="624" y="222" font-size="96" font-weight="600" fill="#9A5F4C" text-anchor="start">16</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="624" y="266" font-size="24" font-weight="500" fill="#696E67" text-anchor="start">学会発表</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="624" y="352" font-size="96" font-weight="600" fill="#9A5F4C" text-anchor="start">2</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="690" y="352" font-size="36" font-weight="600" fill="#9A5F4C" text-anchor="start"> 件以上</text>
        <line x1="528" y1="206" x2="588" y2="206" stroke="#9A5F4C" stroke-width="3" marker-end="url(#ar)"/>
        <line x1="528" y1="336" x2="588" y2="336" stroke="#9A5F4C" stroke-width="3" marker-end="url(#ar)"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="418" font-size="26" font-weight="600" fill="#9A5F4C" text-anchor="start">ID（インストラクショナルデザイン）の観点では「量を減らして質を上げる」改訂</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="452" font-size="24" font-weight="500" fill="#2E2E2E" text-anchor="start">期間: 3 年（変わらず）</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="484" font-size="22" font-weight="500" fill="#696E67" text-anchor="start">出典: JPCA 告知（2024-06-13）／日経メディカル報道（学会発表）</text>
      </svg>
    </div>
  </div>
</body>
</html>
