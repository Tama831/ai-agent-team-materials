<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研究の類型と同意の型</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FBF6EA;
      --color-ink: #030712;
      --color-muted: #4A5568;
      --color-accent: #1E5BE6;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>研究の類型と同意の型</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="consent-matrix-title consent-matrix-desc">
        <title id="consent-matrix-title">研究の類型と同意の型</title>
        <desc id="consent-matrix-desc">研究の類型（介入研究・観察研究・症例報告）と同意の型（文書同意・オプトアウト・包括同意）の対応表。介入研究はICが必要、観察研究は既存情報はオプトアウトが基本、症例報告は施設・学会・投稿先の規定に従う。</desc>
        <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#1B6FA6"/></marker></defs>
        <rect width="100%" height="100%" fill="#FBF6EA"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="150" y="90" font-size="24" font-weight="600" fill="#4A5568" text-anchor="middle">研究の類型</text>
        <rect x="260" y="28" width="260" height="92" rx="6" fill="#DCEBF5" stroke="#ADC7D2" stroke-width="1.5"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="390" y="72" font-size="32" font-weight="600" fill="#0F2238" text-anchor="middle">文書同意</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="390" y="107" font-size="24" font-weight="500" fill="#4A5568" text-anchor="middle">通常の介入研究</text>
        <rect x="540" y="28" width="260" height="92" rx="6" fill="#DCEBF5" stroke="#ADC7D2" stroke-width="1.5"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="670" y="72" font-size="32" font-weight="600" fill="#0F2238" text-anchor="middle">オプトアウト</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="670" y="107" font-size="24" font-weight="500" fill="#4A5568" text-anchor="middle">観察研究で一定条件</text>
        <rect x="820" y="28" width="260" height="92" rx="6" fill="#DCEBF5" stroke="#ADC7D2" stroke-width="1.5"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="950" y="72" font-size="32" font-weight="600" fill="#0F2238" text-anchor="middle">包括同意</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="950" y="107" font-size="24" font-weight="500" fill="#4A5568" text-anchor="middle">既存コホートなど</text>
        <rect x="40" y="130" width="200" height="98" rx="6" fill="#DCEBF5" stroke="#ADC7D2" stroke-width="1.5"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="56" y="164" font-size="30" font-weight="600" fill="#0F2238" text-anchor="start">介入研究</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="56" y="190" font-size="22" font-weight="500" fill="#4A5568" text-anchor="start">新しい介入・</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="56" y="214" font-size="22" font-weight="500" fill="#4A5568" text-anchor="start">比較試験</text>
        <rect x="260" y="130" width="260" height="98" rx="6" fill="#FBF6EA" stroke="#B7C7D3" stroke-width="1.5"/>
        <rect x="540" y="130" width="260" height="98" rx="6" fill="#FBF6EA" stroke="#B7C7D3" stroke-width="1.5"/>
        <rect x="820" y="130" width="260" height="98" rx="6" fill="#FBF6EA" stroke="#B7C7D3" stroke-width="1.5"/>
        <rect x="40" y="232" width="200" height="98" rx="6" fill="#DCEBF5" stroke="#ADC7D2" stroke-width="1.5"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="56" y="266" font-size="30" font-weight="600" fill="#0F2238" text-anchor="start">観察研究</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="56" y="292" font-size="22" font-weight="500" fill="#4A5568" text-anchor="start">カルテレビュー・</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="56" y="316" font-size="22" font-weight="500" fill="#4A5568" text-anchor="start">アンケート</text>
        <rect x="260" y="232" width="260" height="98" rx="6" fill="#FBF6EA" stroke="#B7C7D3" stroke-width="1.5"/>
        <rect x="540" y="232" width="260" height="98" rx="6" fill="#FBF6EA" stroke="#B7C7D3" stroke-width="1.5"/>
        <rect x="820" y="232" width="260" height="98" rx="6" fill="#FBF6EA" stroke="#B7C7D3" stroke-width="1.5"/>
        <rect x="40" y="334" width="200" height="98" rx="6" fill="#DCEBF5" stroke="#ADC7D2" stroke-width="1.5"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="56" y="368" font-size="30" font-weight="600" fill="#0F2238" text-anchor="start">症例報告</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="56" y="394" font-size="22" font-weight="500" fill="#4A5568" text-anchor="start">1〜数例の報告</text>
        <rect x="260" y="334" width="260" height="98" rx="6" fill="#FBF6EA" stroke="#B7C7D3" stroke-width="1.5"/>
        <rect x="540" y="334" width="260" height="98" rx="6" fill="#FBF6EA" stroke="#B7C7D3" stroke-width="1.5"/>
        <rect x="820" y="334" width="260" height="98" rx="6" fill="#FBF6EA" stroke="#B7C7D3" stroke-width="1.5"/>
        <rect x="260" y="130" width="260" height="98" rx="6" fill="#EBEDE5" stroke="#1B6FA6" stroke-width="3"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="390" y="174" font-size="28" font-weight="600" fill="#1B6FA6" text-anchor="middle">ICが必要</text>
        <rect x="540" y="232" width="260" height="98" rx="6" fill="#EBEDE5" stroke="#1B6FA6" stroke-width="3"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="670" y="272" font-size="26" font-weight="600" fill="#1B6FA6" text-anchor="middle">既存情報は</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="670" y="302" font-size="26" font-weight="600" fill="#1B6FA6" text-anchor="middle">オプトアウトが基本</text>
        <rect x="260" y="334" width="820" height="98" rx="6" fill="#FBF6EA" stroke="#7E6942" stroke-width="2.5"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="670" y="376" font-size="30" font-weight="600" fill="#7E6942" text-anchor="middle">施設・学会・投稿先の規定に従う</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="670" y="412" font-size="24" font-weight="500" fill="#0F2238" text-anchor="middle">患者本人の同意を求められることが多い（投稿先の規定による）</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="470" font-size="24" font-weight="500" fill="#4A5568" text-anchor="start">「この研究にはどれが適切か」を IRB に出す前に自分で答えておく</text>
      </svg>
    </div>
  </div>
</body>
</html>
