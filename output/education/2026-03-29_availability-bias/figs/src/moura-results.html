<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主要結果（Moura 2026）</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #F6F9FB;
      --color-ink: #2A3640;
      --color-muted: #4A5568;
      --color-accent: #7BA7BC;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>主要結果（Moura 2026）</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="moura-results-title moura-results-desc">
        <title id="moura-results-title">主要結果（Moura 2026）</title>
        <desc id="moura-results-desc">回帰係数bは0.165でp値は0.018、専門医では経験10年以上で誤診が減少（b=-0.361、p=0.046）という3つの主要結果を大きな数字で並べ、たくさん診ていること自体はバイアス軽減にならないと結ぶ図。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5568"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7BA7BC"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#F6F9FB"/>
        
                <rect x="40" y="40" width="336" height="320" rx="6" fill="#F6F9FB" stroke="#C3D1DA" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="64" y="92" font-size="28" font-weight="600" fill="#2A3640" text-anchor="start">回帰係数 (b)</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="64" y="196" font-size="72" font-weight="600" fill="#567585" text-anchor="start">0.165</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="64" y="262" font-size="24" font-weight="500" fill="#2A3640" text-anchor="start">直近の臨床遭遇が</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="64" y="298" font-size="24" font-weight="500" fill="#2A3640" text-anchor="start">誤診率を有意に上昇させる</text>
        <rect x="392" y="40" width="336" height="320" rx="6" fill="#F6F9FB" stroke="#C3D1DA" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="416" y="92" font-size="28" font-weight="600" fill="#2A3640" text-anchor="start">p値</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="416" y="196" font-size="72" font-weight="600" fill="#567585" text-anchor="start">0.018</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="416" y="262" font-size="24" font-weight="500" fill="#2A3640" text-anchor="start">統計的に有意</text>
        <rect x="744" y="40" width="336" height="320" rx="6" fill="#F6F9FB" stroke="#C3D1DA" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="768" y="92" font-size="28" font-weight="600" fill="#2A3640" text-anchor="start">経験年数の影響</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="768" y="196" font-size="72" font-weight="600" fill="#8A695C" text-anchor="start">-0.361</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="768" y="262" font-size="24" font-weight="500" fill="#2A3640" text-anchor="start">専門医では10年以上で</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="768" y="298" font-size="24" font-weight="500" fill="#2A3640" text-anchor="start">誤診が減少</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="768" y="334" font-size="24" font-weight="500" fill="#2A3640" text-anchor="start">p = 0.046</text>
        <rect x="40" y="388" width="1040" height="68" rx="6" fill="#E4EDF2" stroke="#7BA7BC" stroke-width="2.5"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="432" font-size="30" font-weight="600" fill="#2A3640" text-anchor="middle">「たくさん診ている」こと自体はバイアス軽減にならない</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="494" font-size="22" font-weight="500" fill="#67737E" text-anchor="start">出典: Moura et al., BMJ Quality &amp; Safety 2026（医師1015名・横断調査）</text>
      </svg>
    </div>
  </div>
</body>
</html>
