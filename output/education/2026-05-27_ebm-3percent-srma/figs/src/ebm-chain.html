<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>質が低いSRMAの連鎖反応</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FFFFFF;
      --color-ink: #030712;
      --color-muted: #4A5568;
      --color-accent: #1E5BE6;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>質が低いSRMAの連鎖反応</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ebmchain-title ebmchain-desc">
        <title id="ebmchain-title">質が低いSRMAの連鎖反応</title>
        <desc id="ebmchain-desc">質の低い一次研究をSRMAで統合すると不正確なガイドラインになり、患者ケアにダメージが及ぶ連鎖を示す図。</desc>
        <defs>
          <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5568"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <rect x="40" y="100" width="224" height="170" rx="6" fill="#F5F8FC" stroke="#C7D2E3" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="152" y="172" font-size="30" font-weight="600" fill="#030712" text-anchor="middle">質の低い</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="152" y="214" font-size="30" font-weight="600" fill="#030712" text-anchor="middle">一次研究</text>
        <line x1="270" y1="185" x2="306" y2="185" stroke="#4A5568" stroke-width="3" marker-end="url(#ah)"/>
        <rect x="312" y="100" width="224" height="170" rx="6" fill="#F5F8FC" stroke="#C7D2E3" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="424" y="172" font-size="30" font-weight="600" fill="#030712" text-anchor="middle">SRMAで</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="424" y="214" font-size="30" font-weight="600" fill="#030712" text-anchor="middle">統合</text>
        <line x1="542" y1="185" x2="578" y2="185" stroke="#4A5568" stroke-width="3" marker-end="url(#ah)"/>
        <rect x="584" y="100" width="224" height="170" rx="6" fill="#F5F8FC" stroke="#C7D2E3" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="696" y="172" font-size="30" font-weight="600" fill="#030712" text-anchor="middle">不正確な</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="696" y="214" font-size="30" font-weight="600" fill="#030712" text-anchor="middle">ガイドライン</text>
        <line x1="814" y1="185" x2="850" y2="185" stroke="#4A5568" stroke-width="3" marker-end="url(#ah)"/>
        <rect x="856" y="100" width="224" height="170" rx="6" fill="#EAF0FD" stroke="#1E5BE6" stroke-width="3"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="968" y="172" font-size="30" font-weight="600" fill="#030712" text-anchor="middle">患者ケアへの</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="968" y="214" font-size="30" font-weight="600" fill="#030712" text-anchor="middle">ダメージ</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="424" y="326" font-size="28" font-weight="600" fill="#1E5BE6" text-anchor="middle">Garbage in, Garbage out</text>
        <rect x="40" y="372" width="1040" height="2" rx="0" fill="#C7D2E3"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="560" y="436" font-size="34" font-weight="600" fill="#030712" text-anchor="middle">一次研究の質がSRMAの限界を決める</text>
      </svg>
    </div>
  </div>
</body>
</html>
