<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>疾患別のSDHスクリーニング</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FBF6EA;
      --color-ink: #0F2238;
      --color-muted: #4A5568;
      --color-accent: #1B6FA6;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>疾患別のSDHスクリーニング</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sdhdisease-title sdhdisease-desc">
        <title id="sdhdisease-title">疾患別のSDHスクリーニング</title>
        <desc id="sdhdisease-desc">全患者に一律のSDH問診票を使うと負荷が大きく介入資源が分散する。疾患別に絞る例として、糖尿病は食アクセスと交通、高血圧は住居安定性と経済的ストレスを優先確認し、資源を必要な人に集中させる。</desc>
        <defs>
          <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5568"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#FBF6EA"/>
        <rect x="40" y="40" width="380" height="420" rx="6" fill="#DCEBF5" stroke="#A9C6DB" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="230" y="94" font-size="30" font-weight="600" fill="#0F2238" text-anchor="middle">全疾患一律</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="230" y="130" font-size="30" font-weight="600" fill="#0F2238" text-anchor="middle">スクリーニング</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="230" y="170" font-size="24" font-weight="500" fill="#4A5568" text-anchor="middle">（例: 全患者にSDH問診票）</text>
        <rect x="64" y="194" width="332" height="1.5" rx="0" fill="#A9C6DB"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="230" y="240" font-size="24" font-weight="600" fill="#4A5568" text-anchor="middle">懸念されること</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="230" y="296" font-size="24" font-weight="500" fill="#0F2238" text-anchor="middle">スクリーニング負荷が大きい</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="230" y="350" font-size="24" font-weight="500" fill="#0F2238" text-anchor="middle">陽性でも介入リソースが</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="230" y="382" font-size="24" font-weight="500" fill="#0F2238" text-anchor="middle">分散する</text>
        <line x1="432" y1="250" x2="492" y2="250" stroke="#4A5568" stroke-width="3" marker-end="url(#ah)"/>
        <rect x="500" y="40" width="580" height="420" rx="6" fill="#FBF6EA" stroke="#1B6FA6" stroke-width="3"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="790" y="94" font-size="32" font-weight="600" fill="#0F2238" text-anchor="middle">疾患別に絞る場合の例</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="790" y="132" font-size="24" font-weight="500" fill="#4A5568" text-anchor="middle">（この研究の結果ではなく、実務上の工夫）</text>
        <rect x="524" y="164" width="190" height="90" rx="6" fill="#DCEBF5" stroke="#A9C6DB" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="619" y="220" font-size="28" font-weight="600" fill="#0F2238" text-anchor="middle">糖尿病患者</text>
        <line x1="722" y1="209" x2="764" y2="209" stroke="#4A5568" stroke-width="3" marker-end="url(#ah)"/>
        <rect x="772" y="164" width="284" height="90" rx="6" fill="#DCEBF5" stroke="#A9C6DB" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="914" y="218" font-size="26" font-weight="500" fill="#0F2238" text-anchor="middle">食アクセス + 交通</text>
        <rect x="524" y="274" width="190" height="90" rx="6" fill="#DCEBF5" stroke="#A9C6DB" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="619" y="330" font-size="28" font-weight="600" fill="#0F2238" text-anchor="middle">高血圧患者</text>
        <line x1="722" y1="319" x2="764" y2="319" stroke="#4A5568" stroke-width="3" marker-end="url(#ah)"/>
        <rect x="772" y="274" width="284" height="90" rx="6" fill="#DCEBF5" stroke="#A9C6DB" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="914" y="314" font-size="26" font-weight="500" fill="#0F2238" text-anchor="middle">住居安定性</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="914" y="346" font-size="26" font-weight="500" fill="#0F2238" text-anchor="middle">+ 経済的ストレス</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="790" y="420" font-size="28" font-weight="600" fill="#1B6FA6" text-anchor="middle">リソースを必要な人に集中しやすくなる</text>
      </svg>
    </div>
  </div>
</body>
</html>
