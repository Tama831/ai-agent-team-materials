<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>エラー増幅の倍率</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FBF7EF;
      --color-ink: #2E2E2E;
      --color-muted: #696E67;
      --color-accent: #D9876C;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="orch-error-title orch-error-desc">
        <title id="orch-error-title">エラー増幅の倍率</title>
        <desc id="orch-error-desc">単一AIのエラー率を1としたとき、統合者なしでは約17倍、統合者ありでは約4倍に増幅し、統合者がいると増幅倍率が約74パーセント低かったことを横棒で示す図。</desc>
        <defs>
          <marker id="orch-error-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9A5F4C" stroke-width="1.8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#FBF7EF"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="56" font-size="26" font-weight="500" fill="#2E2E2E" text-anchor="start">単一AIのエラー率を 1 としたとき、専門AIを増やすと…</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="120" font-size="32" font-weight="600" fill="#2E2E2E" text-anchor="start">単一AI</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="148" font-size="22" font-weight="500" fill="#696E67" text-anchor="start">基準</text>
        <rect x="330" y="92" width="30" height="64" rx="4" fill="#F2ECE0" stroke="#696E67" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="380" y="146" font-size="56" font-weight="600" fill="#2E2E2E" text-anchor="start">1倍</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="224" font-size="32" font-weight="600" fill="#2E2E2E" text-anchor="start">統合者なし</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="252" font-size="22" font-weight="500" fill="#696E67" text-anchor="start">Bag of Agents</text>
        <rect x="330" y="196" width="520" height="64" rx="4" fill="#F7E5DC" stroke="#D9876C" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="870" y="250" font-size="56" font-weight="600" fill="#9A5F4C" text-anchor="start">17.2倍</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="328" font-size="32" font-weight="600" fill="#2E2E2E" text-anchor="start">統合者あり</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="356" font-size="22" font-weight="500" fill="#696E67" text-anchor="start">Orchestrated</text>
        <rect x="330" y="300" width="133" height="64" rx="4" fill="#8FB09E" stroke="#5C7367" stroke-width="2"/>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="483" y="354" font-size="56" font-weight="600" fill="#2E2E2E" text-anchor="start">4.4倍</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="700" y="328" font-size="26" font-weight="600" fill="#5C7367" text-anchor="start">統合者ありでは</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="700" y="362" font-size="26" font-weight="600" fill="#5C7367" text-anchor="start">増幅倍率が約74%低かった</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="430" font-size="32" font-weight="600" fill="#9A5F4C" text-anchor="start">「専門家の数」より「調整の構造」が重要</text>
        <text font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" x="40" y="474" font-size="22" font-weight="500" fill="#696E67" text-anchor="start">Kim et al., arXiv:2512.08296（2025年12月）Google Research / DeepMind / MIT</text>
      </svg>
    </div>
  </div>
</body>
</html>
