<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藪医者の学舎 — 解説動画プレイヤー</title>
<!-- 外部から何も読み込まない版（2026-10-17）。フォントと React は同じフォルダに置き、JSX は前もって .js に変換してある。
     出典と作り方: fonts/SOURCE.txt・vendor/SOURCE.txt。エンジンを直すときは .jsx を編集して .js を作り直す -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #030712; overflow: hidden; }
  #root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="episode-ep02.js"></script>
<script src="manabiya-themes.js"></script>
<script src="animations.js"></script>
<script src="manabiya-video.js"></script>
<script src="manabiya-video-vertical.js"></script>
<script>
  // ?ep=ep02 でエピソード切替、?mode=vertical で縦型9:16、?theme=broadcast などでテーマ切替
  // theme: duotone / broadcast / paper / chalk / pop / cinema
  // テロップ(字幕)は既定OFF＝本動画。読み上げ・ナレーション確認用に出すなら ?captions=on
  const q = new URLSearchParams(location.search);
  const epId = q.get('ep') || 'ep02';
  const theme = q.get('theme') || 'duotone';
  const showCaptions = q.get('captions') === 'on';
  const App = q.get('mode') === 'vertical' ? window.ManabiyaVideoVertical : window.ManabiyaVideo;
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, { episodeId: epId, theme: theme, showCaptions: showCaptions }));
</script>
</body>
</html>
