<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15121e"/>
      <stop offset="0.55" stop-color="#241a2e"/>
      <stop offset="1" stop-color="#36283c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.74" r="0.72">
      <stop offset="0" stop-color="#e7a85a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e7a85a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.18" cy="0.10" r="0.5">
      <stop offset="0" stop-color="#f5b8c4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f5b8c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fur" cx="0.42" cy="0.30" r="0.8">
      <stop offset="0" stop-color="#c89066"/>
      <stop offset="0.55" stop-color="#b58258"/>
      <stop offset="1" stop-color="#9a6940"/>
    </radialGradient>
    <radialGradient id="cream" cx="0.5" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#f7eddc"/>
      <stop offset="1" stop-color="#ebdbbe"/>
    </radialGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7a3ad"/>
      <stop offset="0.65" stop-color="#f5a0aa" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f5a0aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="water" cx="0.5" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#f8d290"/>
      <stop offset="0.5" stop-color="#ecb45c"/>
      <stop offset="1" stop-color="#d0853a"/>
    </radialGradient>
    <linearGradient id="towel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcf6ec"/>
      <stop offset="1" stop-color="#eee0cc"/>
    </linearGradient>
    <radialGradient id="foxfur" cx="0.45" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#f0975a"/>
      <stop offset="1" stop-color="#df7a3a"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5d39"/>
      <stop offset="0.55" stop-color="#6b4528"/>
      <stop offset="1" stop-color="#4d3120"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#pink)"/>

  <!-- moon -->
  <circle cx="800" cy="196" r="112" fill="#f4ecd6" opacity="0.10"/>
  <circle cx="800" cy="196" r="72" fill="#f8f1dd"/>
  <circle cx="824" cy="178" r="60" fill="#34283c" opacity="0.55"/>

  <!-- steam -->
  <g filter="url(#soft)" fill="none" stroke="#f5eede" stroke-linecap="round" opacity="0.5">
    <path d="M250 470 Q210 400 250 340 Q290 280 250 210" stroke-width="22"/>
    <path d="M780 470 Q820 400 780 340 Q740 280 780 210" stroke-width="22"/>
    <path d="M512 360 Q480 300 512 250 Q544 200 512 150" stroke-width="18" opacity="0.7"/>
  </g>

  <!-- tub back rim + water -->
  <ellipse cx="512" cy="780" rx="378" ry="128" fill="url(#wood)"/>
  <ellipse cx="512" cy="756" rx="316" ry="92" fill="url(#water)"/>
  <ellipse cx="512" cy="734" rx="300" ry="70" fill="#f9d99a" opacity="0.35"/>

  <!-- ぽん (tanuki) — shaded -->
  <g transform="translate(277,300) scale(2.36)">
    <ellipse cx="62" cy="46" rx="21" ry="23" fill="#8a6038"/>
    <ellipse cx="138" cy="46" rx="21" ry="23" fill="#8a6038"/>
    <ellipse cx="62" cy="49" rx="11" ry="12" fill="#c89a6c"/>
    <ellipse cx="138" cy="49" rx="11" ry="12" fill="#c89a6c"/>
    <path d="M38 156 Q38 112 100 112 Q162 112 162 156 Z" fill="url(#fur)"/>
    <ellipse cx="100" cy="150" rx="50" ry="30" fill="url(#cream)"/>
    <circle cx="100" cy="86" r="55" fill="url(#fur)"/>
    <ellipse cx="100" cy="104" rx="41" ry="33" fill="url(#cream)"/>
    <ellipse cx="78" cy="84" rx="17" ry="22" fill="#4f3825" transform="rotate(-12 78 84)"/>
    <ellipse cx="122" cy="84" rx="17" ry="22" fill="#4f3825" transform="rotate(12 122 84)"/>
    <ellipse cx="62" cy="103" rx="13" ry="9" fill="url(#blush)"/>
    <ellipse cx="138" cy="103" rx="13" ry="9" fill="url(#blush)"/>
    <ellipse cx="80" cy="86" rx="8.5" ry="10" fill="#fff"/>
    <ellipse cx="120" cy="86" rx="8.5" ry="10" fill="#fff"/>
    <circle cx="81" cy="88" r="5.2" fill="#33241a"/>
    <circle cx="119" cy="88" r="5.2" fill="#33241a"/>
    <circle cx="83.4" cy="85.4" r="2" fill="#fff"/>
    <circle cx="123.4" cy="85.4" r="2" fill="#fff"/>
    <circle cx="79" cy="90" r="1.2" fill="#fff" opacity="0.7"/>
    <circle cx="117" cy="90" r="1.2" fill="#fff" opacity="0.7"/>
    <ellipse cx="100" cy="102" rx="6.5" ry="5" fill="#3a2a1f"/>
    <circle cx="98" cy="100.5" r="1.4" fill="#fff" opacity="0.5"/>
    <path d="M100 106 Q100 114 92 115 M100 106 Q100 114 108 115" stroke="#3a2a1f" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="66" cy="150" rx="15" ry="11" fill="#a6764e"/>
    <ellipse cx="134" cy="150" rx="15" ry="11" fill="#a6764e"/>
    <ellipse cx="100" cy="52" rx="50" ry="9" fill="#6b4528" opacity="0.16"/>
    <rect x="48" y="40" width="104" height="24" rx="12" fill="url(#towel)"/>
    <rect x="48" y="46" width="104" height="5" fill="#e89aa6" opacity="0.75"/>
    <rect x="48" y="40" width="104" height="4" rx="2" fill="#e89aa6" opacity="0.45"/>
  </g>

  <!-- こん (fox) peeking, lower-left -->
  <g transform="translate(70,556) scale(1.7)">
    <path d="M92 70 Q128 60 118 100 Q112 120 92 108 Q86 88 92 70Z" fill="url(#foxfur)"/>
    <path d="M104 96 Q122 90 116 110 Q112 118 100 110Z" fill="#f3ead9"/>
    <path d="M30 44 L18 8 L50 34 Z" fill="url(#foxfur)"/>
    <path d="M90 44 L102 8 L70 34 Z" fill="url(#foxfur)"/>
    <path d="M30 40 L23 17 L43 33 Z" fill="#3a2a22"/>
    <path d="M90 40 L97 17 L77 33 Z" fill="#3a2a22"/>
    <path d="M60 32 Q96 42 86 78 Q72 104 60 104 Q48 104 34 78 Q24 42 60 32Z" fill="url(#foxfur)"/>
    <path d="M60 60 Q80 64 74 86 Q66 100 60 100 Q54 100 46 86 Q40 64 60 60Z" fill="#f5ecdd"/>
    <ellipse cx="40" cy="76" rx="7" ry="5" fill="url(#blush)"/>
    <ellipse cx="80" cy="76" rx="7" ry="5" fill="url(#blush)"/>
    <path d="M43 64 Q50 61 57 66 Q50 70 43 64Z" fill="#fff"/>
    <path d="M77 64 Q70 61 63 66 Q70 70 77 64Z" fill="#fff"/>
    <ellipse cx="51" cy="66" rx="2.8" ry="3.2" fill="#33241a"/>
    <ellipse cx="69" cy="66" rx="2.8" ry="3.2" fill="#33241a"/>
    <circle cx="52.2" cy="64.7" r="0.9" fill="#fff"/>
    <circle cx="70.2" cy="64.7" r="0.9" fill="#fff"/>
    <ellipse cx="60" cy="82" rx="4" ry="3" fill="#3a2a22"/>
    <path d="M57 88 Q63 91 69 86.5" stroke="#3a2a22" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- water front lip (seats ぽん in the bath) -->
  <ellipse cx="512" cy="812" rx="316" ry="66" fill="url(#water)"/>
  <ellipse cx="512" cy="792" rx="300" ry="50" fill="#fbe0a8" opacity="0.45"/>
</svg>
